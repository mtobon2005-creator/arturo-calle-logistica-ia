<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arturo Calle · Alternativa nueva</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  <style>
    :root { color-scheme: light; --ink:#14251f; --green:#176b50; --line:#e5ebe7; }
    body { margin:0; background:#f6f8f5; color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
    header { padding:12px 24px; border-bottom:1px solid var(--line); background:white; }
    header a { color:var(--green); text-decoration:none; font-weight:650; }
    #loader { max-width:640px; margin:16vh auto; padding:28px; text-align:center; }
    #loader h1 { font-size:1.5rem; }
    #loader p { color:#65736d; }
    #root { min-height:75vh; }
  </style>
</head>
<body>
  <header><a href="../">← Proyecto · Arturo Calle</a></header>
  <main id="root">
    <section id="loader">
      <h1>Preparando la alternativa nueva</h1>
      <p>Esta versión inicia Python en el navegador. La primera apertura puede tardar entre 30 y 60 segundos; deja esta pestaña abierta mientras carga.</p>
    </section>
  </main>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
    mount({
      entrypoint: "streamlit_app.py",
      requirements: ["pandas"],
      streamlitConfig: {
        "theme.base": "light",
        "theme.primaryColor": "#176b50",
        "theme.backgroundColor": "#f6f8f5",
        "theme.secondaryBackgroundColor": "#eef3ee",
        "theme.textColor": "#14251f"
      },
      files: {
        "streamlit_app.py": { url: "./streamlit_app.py" }
      }
    }, document.getElementById("root"));
  </script>
</body>
</html>
